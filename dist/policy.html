<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content=""><meta name="author" content="Valentin"><title>Our policy</title><link rel="apple-touch-icon" href="https://lambtonmun.ca/img/favicons/apple-touch-icon.png" sizes="180x180"><link rel="icon" href="https://lambtonmun.ca/img/img/favicons/favicon-32x32.png" sizes="32x32" type="image/png"><link rel="icon" href="https://lambtonmun.ca/img/img/favicons/favicon-16x16.png" sizes="16x16" type="image/png"><link rel="manifest" href="https://lambtonmun.ca/img/favicons/manifest.json"><link rel="mask-icon" href="https://lambtonmun.ca/img/favicons/safari-pinned-tab.svg" color="#7952b3"><link rel="icon" href="https://lambtonmun.ca/img/favicons/favicon.ico"><meta name="theme-color" content="#009edb"><style>#pdfViewer {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
            overflow: auto;
        }
        .blog-footer {
            width: 100%;
            position: absolute;
            bottom: 0;
        }</style><script defer="defer" src="main.js"></script></head><body><div class="container"><header class="blog-header py-1"><div class="row flex-nowrap justify-content-between align-items-center"><div class="col-4 pt-1"><a class="link-secondary" href="./"><img src="https://lambtonmun.ca/img/Lambton-MUN-2.svg" width="100" class="img-responsive" alt="Main logo"></a></div><div class="col-4 text-center"><a class="blog-header-logo text-dark" href="./">Lambton MUN</a></div><div class="col-4 d-flex justify-content-end align-items-center"><a class="link-secondary" href="#" aria-label="Search"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="mx-3" role="img" viewBox="0 0 24 24"><title>Search</title><circle cx="10.5" cy="10.5" r="7.5"/><path d="M21 21l-5.2-5.2"/></svg> </a><a class="btn btn-sm btn-outline-secondary" href="#">Sign up</a></div></div></header><div class="nav-scroller py-1 mb-2"><nav class="nav d-flex justify-content-between"><a class="p-2 link-secondary" href="./goals.html">Our goals and values</a> <a class="p-2 link-secondary" href="./members.html">Our members</a> <a class="p-2 link-secondary" href="./events.html">Upcoming events</a> <a class="p-2 link-secondary" href="./policy.html">Policy and conditions</a> <a class="p-2 link-secondary" href="./contact.html">Contact us</a></nav></div></div><main class="container"><div id="pdfViewer"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.7.107/pdf.min.js"></script><script>const pdfUrl = 'https://lambtonmun.ca/img/Statute_LMUN_2024_Version_1.pdf'; // Replace with your PDF file URL

        // Initialize PDF.js
        const pdfjsLib = window['pdfjs-dist/build/pdf'];

        // The workerSrc property points to the location of the pdf.worker.js file
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.7.107/pdf.worker.min.js';

        // Fetch the PDF document
        pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
            console.log(`PDF loaded. Number of pages: ${pdf.numPages}`);

            // Loop through each page
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                // Create a container div for each page
                const pageDiv = document.createElement('div');
                pageDiv.className = 'pdf-page';
                document.getElementById('pdfViewer').appendChild(pageDiv);

                // Render the page
                renderPage(pdf, pageNum, pageDiv);
            }
        }).catch(error => console.error('Error loading the PDF:', error));

        function renderPage(pdf, pageNumber, pageContainer) {
            pdf.getPage(pageNumber).then(page => {
                const scale = 1.5;
                const viewport = page.getViewport({ scale });

                // Create a canvas element for each page
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                // Append canvas to the page container
                pageContainer.appendChild(canvas);

                // Render the page into the canvas
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                page.render(renderContext).promise.then(() => {
                    //console.log(`Page ${pageNumber} rendered`);
                });
            }).catch(error => console.error(`Error rendering page ${pageNumber}:`, error));
        }</script></main><footer class="blog-footer"><p>Webpage built for <a href="https://lambtonmun.ca/">Lambton MUN</a></p></footer></body></html>
